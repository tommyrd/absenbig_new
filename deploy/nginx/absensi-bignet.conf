# Nginx Reverse Proxy Configuration — Absensi BIGNET (PT Borneo Inovasi Gemilang)
# Simpan ke: /etc/nginx/sites-available/absensi-bignet.conf
# Aktifkan: sudo ln -s /etc/nginx/sites-available/absensi-bignet.conf /etc/nginx/sites-enabled/
# SSL Let's Encrypt: sudo certbot --nginx -d absensi.bignet.co.id

server {
    listen 80;
    listen [::]:80;
    server_name absensi.bignet.co.id;

    # Redirect seluruh HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name absensi.bignet.co.id;

    # Sertifikat TLS/SSL (dikelola certbot atau SSL internal perusahaan)
    ssl_certificate /etc/letsencrypt/live/absensi.bignet.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absensi.bignet.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batas payload upload foto absensi selfie & logo (JSON base64 <= 12MB)
    client_max_body_size 12M;

    # SSE Real-Time Workforce Feed Stream (matikan buffering)
    location /api/v1/workforce/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Aplikasi & REST API Absensi BIGNET
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
