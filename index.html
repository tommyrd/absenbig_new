    <script>
      (function () {
        try {
          var mode = localStorage.getItem('bignet_theme') || 'light';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
