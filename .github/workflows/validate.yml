name: Validate Absensi BIGNET

on:
  push:
    branches:
      - main
      - fix/admin-operasional-non-pegawai
  pull_request:
    branches:
      - main
      - fix/admin-operasional-non-pegawai

permissions:
  contents: read

jobs:
  validate:
    name: Tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: npm test

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production frontend
        run: npm run build
